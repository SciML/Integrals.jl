name: Documentation

on:
  push:
    branches:
      - master
      - 'release-'
    tags: '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    uses: "SciML/.github/.github/workflows/documentation.yml@v1"
    with:
      coverage: true
      coverage-directories: "src"
    secrets: "inherit"
